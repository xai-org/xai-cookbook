repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.23.1
  hooks:
    - id: gitleaks
- repo: local
  hooks:
    - id: nbmake
      name: Test successful notebook execution
      entry: uv run pytest --nbmake
      language: system
      files: ^examples/.*\.ipynb$
    - id: catalog
      name: Check example front matter, the catalog, and links
      entry: uv run catalog/build.py --check
      language: system
      pass_filenames: false
      files: (\.md$|^registry\.yaml$|^catalog/)