name: Catalog

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Front matter, catalog, and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyyaml>=6" "jsonschema>=4.20"
      - run: python catalog/build.py --check
