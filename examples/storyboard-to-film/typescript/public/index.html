<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Storyboard to Short Film</title>
<style>
  :root {
    --bg: #fff;
    --fg: #0a0a0a;
    --muted: rgb(10 10 10 / 0.6);
    --faint: rgb(10 10 10 / 0.3);
    --card: #f9f8f6;
    --secondary: #f2f1ef;
    --secondary-hover: #e9e8e5;
    --border: rgb(10 10 10 / 0.15);
    --rule: rgb(213 217 226 / 0.55);
    --primary: #0a0a0a;
    --primary-hover: #202329;
    --on-primary: #f9f8f6;
    --bubble: rgb(10 10 10 / 0.06);
    --track: rgb(10 10 10 / 0.08);
    --track-ready: rgb(10 10 10 / 0.2);
    --accent: #ff6308;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/24px var(--sans); background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; }
  main { max-width: 1120px; margin: 0 auto; padding: 72px 24px; }
  .eyebrow { margin: 0; font-size: 14px; }
  h1 { margin: 8px 0 0; font-size: 48px; line-height: 1.1; font-weight: 450; letter-spacing: -0.01em; }
  .lede { margin: 12px 0 32px; max-width: 620px; font-size: 16px; line-height: 26px; color: var(--muted); }

  button { font: inherit; border: 0; cursor: pointer; }
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 18px; border-radius: 9999px; font-size: 14px; font-weight: 500; white-space: nowrap; text-decoration: none; }
  .pill-primary { background: var(--primary); color: var(--on-primary); }
  .pill-primary:hover { background: var(--primary-hover); }
  .pill-primary:disabled { opacity: 0.4; cursor: default; }
  .pill-secondary { background: var(--secondary); color: var(--fg); }
  .pill-secondary:hover { background: var(--secondary-hover); }
  .pill svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  form { display: flex; gap: 8px; max-width: 720px; }
  input { flex: 1; height: 40px; padding: 0 18px; border: 1px solid var(--border); border-radius: 9999px; background: var(--bg); color: var(--fg); font: inherit; outline: none; }
  input:focus { border-color: var(--fg); }
  input::placeholder { color: var(--faint); }
  .examples { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .examples .pill { height: 30px; padding: 0 12px; font-size: 13px; }

  .stage { display: grid; gap: 16px; margin-top: 48px; }
  .card { background: var(--card); border-radius: 16px; padding: 20px 22px; }
  .card-label { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .thinking summary { margin: 0; list-style: none; cursor: pointer; }
  .thinking summary::-webkit-details-marker { display: none; }
  .thinking:has(#reasoning:empty) summary { cursor: default; }
  .chevron { width: 14px; height: 14px; margin-left: auto; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.2s; }
  .thinking[open] .chevron { transform: rotate(180deg); }
  .thinking:has(#reasoning:empty) .chevron { display: none; }
  #reasoning { margin-top: 12px; max-height: 200px; overflow: auto; white-space: pre-wrap; font: 12px/20px var(--mono); color: var(--muted); }
  #reasoning:empty { display: none; }
  .dots { display: none; gap: 4px; }
  .card.active .dots { display: inline-flex; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite both; }
  .dots i:nth-child(2) { animation-delay: 0.2s; }
  .dots i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  #title { margin: 0; font-size: 24px; line-height: 32px; font-weight: 450; letter-spacing: -0.01em; }
  #style { margin: 4px 0 0; max-width: 720px; color: var(--muted); }
  #movie { display: block; width: 100%; aspect-ratio: 16 / 9; margin-top: 20px; border-radius: 10px; background: var(--fg); }
  #movie[hidden] { display: none; }
  #note { margin: 16px 0 0; font-size: 13px; color: var(--muted); }
  #note:empty { display: none; }

  .shots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .shots:empty { display: none; }
  .shot { animation: appear 0.3s ease-out; }
  .state { font-variant-numeric: tabular-nums; }
  .state:empty { display: none; }
  .frame { aspect-ratio: 16 / 9; border-radius: 10px; background: var(--secondary); overflow: hidden; }
  .frame img, .frame video { display: block; width: 100%; height: 100%; object-fit: cover; }
  .frame img { animation: fade 0.4s ease-out; }
  .scene { margin: 14px 0 0; }
  .line { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-top: 14px; }
  @keyframes appear { from { opacity: 0; transform: translateY(4px); } }
  @keyframes fade { from { opacity: 0; } }
  .speaker { display: flex; align-items: center; gap: 6px; padding: 0 6px; font-size: 12px; line-height: 16px; color: var(--muted); }
  .status { color: var(--faint); }
  .bubble { display: flex; align-items: baseline; gap: 8px; max-width: 100%; padding: 9px 15px; border: 1px solid transparent; border-radius: 18px 18px 18px 6px; background: var(--bubble); color: inherit; font-size: 14px; line-height: 22px; text-align: left; transition: background 0.2s, color 0.2s; }
  .bubble:disabled { cursor: default; }
  .bubble svg { display: none; flex: none; width: 10px; height: 10px; fill: currentColor; }
  .ready .bubble svg { display: block; }
  .ready .bubble:hover { border-color: var(--border); }
  .line.playing .bubble { border-color: transparent; background: var(--primary); color: var(--on-primary); }
  .eq { display: none; align-items: flex-end; gap: 2px; height: 10px; }
  .playing .eq { display: inline-flex; }
  .eq i { width: 2px; height: 100%; border-radius: 1px; background: var(--accent); animation: eq 0.9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: 0.15s; }
  .eq i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes eq { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }

  @media (max-width: 860px) {
    h1 { font-size: 36px; }
    .shots { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">SpaceXAI Cookbook</p>
  <h1>Storyboard to Short Film</h1>
  <p class="lede">Give Grok a premise in one line. It plans four shots, draws a keyframe for each one, animates them into eight-second clips, and narrates the story. A film takes a few minutes and costs about $5.</p>
  <form id="form">
    <input id="premise" required aria-label="Premise" placeholder="A paper boat's journey through a rainy city at night">
    <button id="go" class="pill pill-primary">Make film <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button>
  </form>
  <div class="examples">Try one:
    <button type="button" class="pill pill-secondary" data-premise="A paper boat's journey through a rainy city at night">Paper boat</button>
    <button type="button" class="pill pill-secondary" data-premise="A lighthouse keeper's cat on the night of the big storm">Lighthouse cat</button>
    <button type="button" class="pill pill-secondary" data-premise="An old robot tends a rooftop garden through the four seasons">Robot gardener</button>
  </div>

  <div class="stage">
    <details class="card thinking" id="thinking" open hidden>
      <summary class="card-label"><span id="status">Thinking</span> <span class="dots"><i></i><i></i><i></i></span><svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></summary>
      <div id="reasoning"></div>
    </details>
    <section class="card" id="film" hidden>
      <p class="card-label"><span id="phase"></span> <span class="dots"><i></i><i></i><i></i></span></p>
      <p id="title"></p>
      <p id="style"></p>
      <video id="movie" controls hidden></video>
      <p id="note"></p>
    </section>
    <div class="shots" id="shots"></div>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const audio = new Audio();
  let shots = [];
  let narrating = null;
  let thinkingSince = 0;
  let timer = 0;

  document.querySelectorAll(".examples button").forEach((button) => {
    button.onclick = () => ($("premise").value = button.dataset.premise);
  });

  $("thinking").querySelector("summary").onclick = (event) => {
    if (!$("reasoning").textContent) event.preventDefault();
  };

  $("form").onsubmit = (event) => {
    event.preventDefault();
    reset();
    $("go").disabled = true;
    const events = new EventSource(`/api/film?premise=${encodeURIComponent($("premise").value)}`);
    const on = (name, handler) => events.addEventListener(name, (message) => handler(JSON.parse(message.data)));
    const finish = () => {
      events.close();
      clearInterval(timer);
      $("go").disabled = false;
    };

    on("step", ({ step, status }) => {
      if (step === "plan" && status === "active") thinkingSince = Date.now();
      if (step === "plan" && status === "done") {
        const seconds = Math.round((Date.now() - thinkingSince) / 1000);
        $("thinking").open = false;
        $("thinking").classList.remove("active");
        $("status").textContent = `Thought for ${seconds} ${seconds === 1 ? "second" : "seconds"}`;
      }
      if (step === "draw") $("phase").textContent = "Drawing the keyframes";
      if (step === "animate") {
        $("phase").textContent = "Rendering the shots";
        const since = Date.now();
        for (const shot of shots) {
          shot.since = since;
          shot.rendering = true;
          shot.line.querySelector(".status").textContent = "· recording…";
        }
        tick();
        timer = setInterval(tick, 1000);
      }
      if (step === "film") $("phase").textContent = "Joining the shots into one film";
    });
    on("reasoning", ({ text }) => {
      $("reasoning").textContent += text;
      $("reasoning").scrollTop = $("reasoning").scrollHeight;
    });
    on("storyboard", ({ title, style, shots: list }) => {
      $("title").textContent = title;
      $("style").textContent = style;
      $("film").hidden = false;
      shots = list.map(addShot);
    });
    on("keyframe", ({ index, url }) => {
      const shot = shots[index];
      const image = new Image();
      image.src = url;
      image.alt = shot.scene;
      shot.keyframe = url;
      shot.frame.replaceChildren(image);
      setState(shot, "", false);
      if (index === 0) shots.slice(1).forEach((other) => setState(other, "Drawing from keyframe 1", true));
    });
    on("video", ({ index, url }) => {
      const shot = shots[index];
      const video = document.createElement("video");
      video.src = url;
      video.poster = shot.keyframe;
      video.controls = true;
      shot.frame.replaceChildren(video);
      shot.video = url;
      shot.rendering = false;
      setState(shot, `Rendered in ${elapsed(shot.since)}`, false);
    });
    on("narration", ({ index, url }) => {
      const shot = shots[index];
      shot.audio = url;
      shot.line.classList.add("ready");
      shot.line.querySelector(".status").textContent = "";
      shot.line.querySelector(".bubble").disabled = false;
    });
    on("done", ({ film, folder, cost }) => {
      $("film").classList.remove("active");
      $("phase").textContent = "Film";
      if (film) {
        $("movie").poster = shots[0].keyframe;
        $("movie").src = film;
        $("movie").hidden = false;
      }
      const saved = `Saved to ${folder}/. The images and videos cost $${cost.toFixed(2)}.`;
      $("note").textContent = film ? saved : `ffmpeg isn't installed, so the shots weren't joined into one film. ${saved}`;
      finish();
    });
    on("failure", ({ message }) => {
      stop(message);
      finish();
    });
    // Without this, the browser would reconnect and start a new film.
    events.onerror = () => {
      stop("Lost the connection to the server.");
      finish();
    };
  };

  function addShot({ scene, narration }, index) {
    const el = document.createElement("article");
    el.className = "card shot";
    el.innerHTML = `
      <p class="card-label">Shot ${index + 1}<span class="state"></span><span class="dots"><i></i><i></i><i></i></span></p>
      <div class="frame"></div>
      <p class="scene"></p>
      <div class="line">
        <div class="speaker">Narration<span class="status"></span><span class="eq"><i></i><i></i><i></i></span></div>
        <button class="bubble" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z"/></svg><span></span></button>
      </div>`;
    el.querySelector(".scene").textContent = scene;
    el.querySelector(".bubble span").textContent = narration;
    $("shots").append(el);
    const shot = { el, scene, frame: el.querySelector(".frame"), line: el.querySelector(".line") };
    el.querySelector(".bubble").onclick = () => playNarration(shot);
    setState(shot, index === 0 ? "Drawing the keyframe" : "Waiting for keyframe 1", index === 0);
    return shot;
  }

  function setState(shot, text, active) {
    shot.el.querySelector(".state").textContent = text && `· ${text}`;
    shot.el.classList.toggle("active", active);
  }

  function tick() {
    for (const shot of shots) {
      if (shot.rendering) setState(shot, `Rendering ${elapsed(shot.since)}`, true);
    }
  }

  function elapsed(since) {
    const seconds = Math.floor((Date.now() - since) / 1000);
    return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
  }

  function playNarration(shot) {
    if (shot === narrating && !audio.paused) return audio.pause();
    narrating = shot;
    audio.src = shot.audio;
    audio.play();
  }

  audio.onplay = audio.onpause = () => {
    for (const shot of shots) shot.line.classList.toggle("playing", shot === narrating && !audio.paused);
  };

  function stop(message) {
    alert(message);
    $("thinking").classList.remove("active");
    $("film").classList.remove("active");
    for (const shot of shots) {
      if (!shot.video) setState(shot, "", false);
      shot.rendering = false;
      shot.line.querySelector(".status").textContent = "";
    }
    if (shots.length) $("phase").textContent = "Couldn't make the film";
    else $("status").textContent = "Couldn't make the film";
  }

  function reset() {
    audio.pause();
    clearInterval(timer);
    shots = [];
    narrating = null;
    $("shots").replaceChildren();
    $("reasoning").textContent = "";
    $("status").textContent = "Thinking";
    $("thinking").classList.add("active");
    $("thinking").open = true;
    $("thinking").hidden = false;
    $("film").classList.add("active");
    $("film").hidden = true;
    $("phase").textContent = "";
    $("title").textContent = "";
    $("style").textContent = "";
    $("movie").hidden = true;
    $("movie").removeAttribute("src");
    $("movie").removeAttribute("poster");
    $("movie").load();
    $("note").textContent = "";
  }
</script>
</body>
</html>
