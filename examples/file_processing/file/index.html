<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Test Page",
        "description": "This is a test page with structured data.",
        "mainEntity": {
          "@type": "WebPageElement",
          "name": "Test Paragraph",
          "description": "This is a test paragraph."
        }
      }
    </script>
  </head>
  <body>
    <div class="container">
      <h1>Test Page</h1>
      <p>This is a test paragraph.</p>
      <button onclick="alert('Button clicked!')">Click Me</button>
      <ul>
        <li>Test item 1</li>
        <li>Test item 2</li>
        <li>Test item 3</li>
      </ul>
    </div>
  </body>
</html>
